group = "com.example.nosmai_agora_bridge"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://download.agora.io/sdk/release/' }
    }
}

apply plugin: "com.android.library"
def nosmaiSdkVersion = "3.0.7"
apply plugin: "kotlin-android"

android {
    namespace = "com.example.nosmai_agora_bridge"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    dependencies {
        // Compile against the same release coordinate used by the Effects
        // plugin. The runtime AAR is supplied transitively by that plugin, so
        // this bridge does not package a second native SDK copy.
        compileOnly("com.nosmai:nosmai-sdk:${nosmaiSdkVersion}@aar")
        compileOnly("io.agora.rtc:full-sdk:4.5.2")

        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

// Gradle resolves transitive Android dependencies through the consuming app.
// Keep the verified native artifact in the official release repository and
// allow an explicit local override only while developing the native SDK.
def nosmaiLocalRepo = project.findProperty("nosmaiSdkLocalRepo") ?: System.getenv("NOSMAI_SDK_LOCAL_REPO")
rootProject.allprojects {
    repositories {
        if (nosmaiLocalRepo) {
            ivy {
                name = "nosmaiEffectsSdkLocal"
                url = uri(new File(nosmaiLocalRepo).toURI())
                patternLayout {
                    artifact("[artifact]-[revision].[ext]")
                }
                metadataSources {
                    artifact()
                }
                content {
                    includeModule("com.nosmai", "nosmai-sdk")
                }
            }
        }
        ivy {
            name = "nosmaiEffectsSdk"
            url = uri("https://github.com/nosmai/nosmai_effects_sdk_android/releases/download")
            patternLayout {
                artifact("v[revision]/[artifact]-[revision].[ext]")
            }
            metadataSources {
                artifact()
            }
            content {
                includeModule("com.nosmai", "nosmai-sdk")
            }
        }
    }
}

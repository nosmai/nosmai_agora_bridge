group = "com.example.nosmai_agora_bridge"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://download.agora.io/sdk/release/' }
        // Resolves libs/nosmai-release.aar for the compileOnly fallback used when
        // no ':nosmai' source module is present (i.e. a host app consuming this
        // repo by path). Without this the fallback cannot resolve.
        flatDir { dirs "${projectDir}/libs" }
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.example.nosmai_agora_bridge"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    dependencies {
        // AUTO-SELECT the SDK binding so this bridge works BOTH when dev-linked
        // against the SDK source module and when consumed by a host app.
        //
        // - ':nosmai' present (this repo's own example): source-link, so SDK
        //   source edits apply without rebuilding the .aar.
        // - ':nosmai' absent (a host app such as tikshot, which depends on this
        //   repo by path and has no SDK module): fall back to the prebuilt
        //   libs/nosmai-release.aar via the flatDir repository above.
        //
        // Hardcoding project(':nosmai') broke any host app that consumes this
        // repo directly ("Project with path ':nosmai' could not be found").
        // These are compileOnly: the SDK classes are provided at runtime by the
        // host app's own AAR, so we must not package a second copy.
        if (findProject(':nosmai') != null) {
            compileOnly project(':nosmai')
        } else {
            compileOnly(name: 'nosmai-release', ext: 'aar')
        }
        compileOnly("io.agora.rtc:full-sdk:4.5.2")

        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
